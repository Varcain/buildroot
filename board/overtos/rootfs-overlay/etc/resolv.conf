# Static resolver for the oveRTOS Linux personality. The rootfs is read-only and
# there is no guest DHCP client (no AF_PACKET), so the nameserver is fixed here.
# 1.1.1.1 (Cloudflare) is reachable from the board's 172.1.1.2/24 link out through
# the test-host NAT gateway (172.1.1.1). uClibc getaddrinfo/nslookup read this file.
nameserver 1.1.1.1
