# oveRTOS inetd: SSH via dropbear in inetd mode. NoMMU dropbear has no standalone
# (fork-per-connection) daemon mode, so busybox inetd is the super-server — it
# listens on :22 and, per connection, vfork+execs "dropbear -i" with the accepted
# socket on fds 0/1/2 (the personality's accept->vfork->exec path, same as httpd).
# -r names the host key pre-generated at boot (inittab sysinit).
22 stream tcp nowait root /usr/sbin/dropbear dropbear -i -r /var/run/dropbear/dropbear_ed25519_host_key
